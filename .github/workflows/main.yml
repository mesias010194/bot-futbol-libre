name: Bot Actualizador de Partidos

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        run: python scraper_bot.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name 'Bot Fútbol Libre'
          git config --global user.email 'bot@futbollibre.com'
          git add agenda.json || true
          git commit -m "Actualizando agenda [skip ci]" || echo "No hay cambios para subir"
          git push
